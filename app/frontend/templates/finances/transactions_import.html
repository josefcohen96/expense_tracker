{% extends "finances/base.html" %}
{% block finances_title %}דוח האשראי{% endblock %}

{% block finances_content %}
<style>
    /* `hidden` must win over .btn / .flex / .card display rules on this page. */
    #card-import [hidden] { display: none !important; }
</style>
<div id="card-import" class="max-w-3xl space-y-5" dir="rtl">

    <!-- Page Header -->
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
            <i class="fas fa-file-import text-blue-600"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 leading-tight">דוח האשראי</h1>
    </div>

    <!-- State 1: pick a file -->
    <section id="ci-pick" class="card">
        <div class="card-body">
            <label id="ci-drop" for="ci-file"
                   class="flex flex-col items-center justify-center gap-3 text-center cursor-pointer rounded-2xl border-2 border-dashed border-blue-200 bg-blue-50/40 hover:bg-blue-50 transition-colors px-4 py-10">
                <i class="fas fa-file-import text-3xl text-blue-500"></i>
                <span class="font-semibold text-gray-800">דוח מקס (xlsx) — גרור לכאן או לחץ לבחירה</span>
            </label>
            <input type="file" id="ci-file" accept=".xlsx" class="sr-only">
            <p class="text-sm text-gray-500 mt-3">הדוח החודשי שמגיע במייל מ-max. נוסיף רק עסקאות שעוד לא רשומות.</p>
            <p id="ci-loading" class="text-sm text-blue-700 mt-2" hidden>
                <i class="fas fa-spinner fa-spin"></i>
                קורא את הדוח…
            </p>
            <p id="ci-error" class="text-sm text-red-600 font-medium mt-2" role="alert" hidden></p>
        </div>
    </section>

    <!-- State 2: preview -->
    <section id="ci-preview" class="space-y-5" hidden>
        <div class="card">
            <div class="card-body space-y-4">
                <p id="ci-summary" class="font-semibold text-gray-800"></p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="form-group !mb-0">
                        <label for="ci-payer" class="form-label">מי שילם</label>
                        <select id="ci-payer" class="form-select">
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.display }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group !mb-0">
                        <label for="ci-account" class="form-label">חשבון</label>
                        <select id="ci-account" class="form-select">
                            <option value="">—</option>
                            {% for a in accounts %}
                            <option value="{{ a.id }}">{{ a.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h2 id="ci-new-title" class="text-base sm:text-lg font-semibold text-gray-900 mb-3"></h2>
                <ul id="ci-new-list" class="divide-y divide-gray-100"></ul>
                <p id="ci-new-empty" class="text-gray-600 py-4 text-center" hidden>הכל כבר רשום 🙌</p>
            </div>
        </div>

        <details id="ci-skipped" class="card" hidden>
            <summary id="ci-skipped-title" class="card-body cursor-pointer select-none font-semibold text-gray-700"></summary>
            <p class="text-xs text-gray-500 px-4 -mt-2 mb-1">סמן שורה כדי להוסיף אותה בכל זאת</p>
            <ul id="ci-skipped-list" class="divide-y divide-gray-100 px-4 pb-3"></ul>
        </details>

        <div>
            <button type="button" id="ci-submit" class="btn btn-primary w-full lg:w-auto text-base" style="min-height:48px;"></button>
            <p id="ci-submit-error" class="text-sm text-red-600 font-medium mt-2" role="alert" hidden></p>
        </div>
    </section>

    <!-- State 3: done -->
    <section id="ci-done" class="card" hidden>
        <div class="card-body flex flex-col sm:flex-row sm:items-center gap-3">
            <p class="font-semibold text-gray-900 flex items-center gap-2">
                <i class="fas fa-check-circle text-green-600"></i>
                <span id="ci-done-text"></span>
            </p>
            <a id="ci-done-link" href="/finances/transactions" class="text-blue-600 hover:underline text-sm"></a>
            <button type="button" id="ci-undo" class="btn btn-outline btn-sm sm:mr-auto" hidden>ביטול</button>
        </div>
    </section>
</div>

<script type="application/json" id="transactions-import-data">{{ {"categories": categories} | tojson }}</script>
<script src="/static/js/pages/finances-transactions-import.js?v=20261019"></script>
{% endblock %}
